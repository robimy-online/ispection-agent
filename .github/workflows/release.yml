name: release

# Publishes a signed image to GHCR on a `vX.Y.Z` git tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing via GitHub OIDC

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag v$TAG != package.json $PKG"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-container driver → supports SBOM + provenance attestations (the default `docker` driver does not).
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ispection-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: sigstore/cosign-installer@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      # Sign the image by digest (covers every tag pointing at it). Keyless — no stored key.
      - name: Sign image (cosign keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/ispection-agent@${{ steps.build.outputs.digest }}"
