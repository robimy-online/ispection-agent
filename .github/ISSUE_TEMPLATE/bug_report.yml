name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent version
      description: From the startup log ("ispection agent vX.Y.Z") or the image tag.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How is it running?
      options:
        - Docker (compose)
        - Docker (run)
        - Native (systemd / launchd)
        - From source (npm run dev)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker logs ispection-agent` — redact any claim code / secrets."
      render: shell
